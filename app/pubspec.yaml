name: chgk_trainer
description: "ЧГК-тренажёр (черновик MVP)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  wakelock_plus: ^1.7.0
  http: ^1.2.0                 # OTA: загрузка манифеста и APK
  crypto: ^3.0.3               # OTA: проверка целостности (sha256)
  package_info_plus: ^10.1.0   # OTA: свой build-номер для сравнения с манифестом
                               # (^10 — нижняя граница от wakelock_plus 1.7)
  open_filex: ^4.5.0           # OTA: открыть системный установщик скачанного APK

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Генерируется `python3 scripts/build_app_assets.py`, в git не едет.
    - assets/questions.json
    # Авторский текст приёмов — наоборот, коммитится: генерировать его нечем.
    - assets/tehniki.json

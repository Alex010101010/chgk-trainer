name: chgk_trainer
description: "Панда будет? — тренажёр ЧГК (черновик MVP)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  wakelock_plus: ^1.7.0
  http: ^1.2.0                 # OTA: загрузка манифеста и APK
  crypto: ^3.0.3               # OTA: проверка целостности (sha256)
  package_info_plus: ^10.1.0   # OTA: свой build-номер для сравнения с манифестом
                               # (^10 — нижняя граница от wakelock_plus 1.7)
  open_filex: ^4.5.0           # OTA: открыть системный установщик скачанного APK

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Генерируется `python3 scripts/build_app_assets.py`, в git не едет.
    - assets/questions.json
    # Справка по клише (T14). Тем же скриптом, в git тоже не едет.
    - assets/articles.json
    # Авторский текст приёмов — наоборот, коммитится: генерировать его нечем.
    - assets/tehniki.json
    # Банк реплик панды — тоже авторский текст, из вычитанного черновика
    # data/panda_lines_draft.md.
    - assets/panda_lines.json
    # Раздаточный материал (T20). Генерируется
    # `python3 scripts/build_handout_assets.py`, в git не едет.
    - assets/handouts/
    # Позы панды. 512×512 с квантованной палитрой: на экране картинка живёт
    # в ~120 точек, труколор в исходном килобайте туда не доезжает.
    - assets/panda/
  # Происхождение файлов и почему они статические — assets/fonts/README.md.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
